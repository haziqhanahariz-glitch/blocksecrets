
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOCKSECRETS - Minecraft Hidden Secrets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🟩 BLOCKSECRETS</h1>
  <p>Discover the unknown side of Minecraft.</p>
</header>

<section class="hero">
  <h2>THE SECRETS OF MINECRAFT</h2>
  <p>20 hidden secrets waiting to be discovered.</p>
  <input id="search" type="text"
    placeholder="Search a Minecraft secret...">
</section>

<main>
  <h2>🧩 EXPLORE SECRETS</h2>
  <div id="egg-container" class="egg-grid"></div>
</main>

<div id="modal" class="modal">
  <div class="modal-content">
    <button class="close" id="close">&times;</button>
    <img id="modal-image" src="" alt="">
    <span id="modal-category"></span>
    <h2 id="modal-title"></h2>
    <p id="modal-description"></p>
    <h3>HOW TO FIND IT</h3>
    <p id="modal-how"></p>
    <p id="modal-version"></p>
  </div>
</div>

<footer>
  <p>BLOCKSECRETS © 2026 | Uncover the Unknown.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
